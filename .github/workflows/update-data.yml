name: Refresh data from Google Sheet

on:
  schedule:
    # 每天執行一次（UTC 00:00，對應台灣時間早上 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch sheet
        run: npm run fetch-data

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data.json; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add public/data.json
            git commit -m "chore(data): refresh resources from spreadsheet

            Auto-generated by .github/workflows/update-data.yml"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN doesn't trigger other workflows'
      # `on: push`, so deploy.yml would never fire on its own — trigger it
      # explicitly here once new data has actually landed on main.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
