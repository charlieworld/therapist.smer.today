name: Refresh data from Google Sheet

on:
  schedule:
    # 每天執行一次（UTC 00:00，對應台灣時間早上 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch sheet
        run: npm run fetch-data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data.json; then
            echo "No data changes."
          else
            git add public/data.json
            git commit -m "chore(data): refresh resources from spreadsheet

            Auto-generated by .github/workflows/update-data.yml"
            git push
          fi
