<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
      color: #1c1612;
      background:
        radial-gradient(120% 80% at 8% -10%, #fde9d3 0%, transparent 55%),
        radial-gradient(90% 70% at 110% 10%, #f6dec3 0%, transparent 55%),
        linear-gradient(180deg, #fbf5ef 0%, #f5ebde 100%);
      position: relative;
    }
    .grain {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0.12 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      opacity: 0.32;
      pointer-events: none;
    }
    .frame {
      position: absolute; inset: 64px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .top {
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .wordmark {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 36px;
      color: #c87139;
      letter-spacing: 0.01em;
    }
    .eyebrow {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 19px;
      color: #a85a2e;
      letter-spacing: 0.04em;
    }
    .center {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .title-tc {
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
      font-size: 132px;
      line-height: 1;
      color: #1c1612;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-family: 'Noto Serif TC', serif;
      font-weight: 500;
      font-size: 56px;
      line-height: 1.2;
      color: #4d3f36;
      letter-spacing: -0.005em;
      margin-top: 4px;
    }
    .accent-rule {
      width: 64px; height: 3px;
      background: #c87139;
      margin-top: 18px;
    }
    .bottom {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 18px;
    }
    .url {
      color: #6b574b;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .stamp {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: #c87139;
      letter-spacing: 0.04em;
      display: flex; align-items: center; gap: 12px;
    }
    .star {
      width: 22px; height: 22px;
      color: #c87139;
    }
    .deco-star {
      position: absolute;
      right: 64px;
      top: 50%;
      transform: translateY(-50%);
      width: 280px; height: 280px;
      color: #ecaf7d;
      opacity: 0.22;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <svg class="deco-star" viewBox="-32 -32 64 64">
    <path d="M0 -28 L5 -5 L28 0 L5 5 L0 28 L-5 5 L-28 0 L-5 -5 Z" fill="currentColor"/>
  </svg>
  <div class="grain"></div>
  <div class="frame">
    <div class="top">
      <div class="wordmark">Therapist</div>
      <div class="eyebrow">for those seeking a safe, knowing ear.</div>
    </div>

    <div class="center">
      <div class="title-tc">禁羈友善</div>
      <div class="subtitle">助人工作者資源網</div>
      <div class="accent-rule"></div>
    </div>

    <div class="bottom">
      <div class="url">therapist.smer.today</div>
      <div class="stamp">
        <svg class="star" viewBox="-32 -32 64 64">
          <path d="M0 -28 L5 -5 L28 0 L5 5 L0 28 L-5 5 L-28 0 L-5 -5 Z" fill="currentColor"/>
        </svg>
        made with love · 2026
      </div>
    </div>
  </div>
</body>
</html>
