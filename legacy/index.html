<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDSM 友善諮商資源</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#a18e87',
                            600: '#84746f',
                            700: '#635753',
                            800: '#443c39',
                            900: '#26211f',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdf8f6;
            color: #443c39;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Hero Section -->
    <header class="bg-white shadow-sm border-b border-brand-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
            <h1 class="text-3xl sm:text-4xl font-bold text-brand-800 text-center mb-4">
                BDSM 友善諮商資源
            </h1>
            <p class="text-center text-brand-600 max-w-2xl mx-auto text-lg">
                這是一個整理 BDSM 友善的助人工作者名單。希望能協助每個人找到適合自己的支持資源，在此感到安全、被接納。
            </p>
        </div>
    </header>

    <!-- Filters -->
    <div class="sticky top-0 z-10 bg-white/95 backdrop-blur-sm border-b border-brand-200 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col sm:flex-row gap-4 justify-between items-center">
                <!-- Search -->
                <div class="relative w-full sm:w-96">
                    <input type="text" id="searchInput" placeholder="搜尋姓名、機構、關鍵字..." 
                        class="w-full pl-10 pr-4 py-2 rounded-lg border border-brand-300 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-transparent bg-brand-50 text-brand-900 placeholder-brand-400 transition-shadow">
                    <svg class="w-5 h-5 text-brand-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>

                <!-- Functional Filters -->
                <div class="flex flex-wrap gap-3 items-center justify-center sm:justify-end w-full sm:w-auto">
                    <div class="relative">
                        <select id="regionFilter" class="appearance-none bg-brand-50 border border-brand-300 text-brand-900 py-2 pl-4 pr-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-400 cursor-pointer hover:bg-white transition-colors">
                            <option value="">所有地區</option>
                            <!-- Options will be populated by JS -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-brand-600">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </div>

                    <label class="inline-flex items-center cursor-pointer select-none bg-brand-50 border border-brand-300 rounded-lg px-3 py-2 hover:bg-white transition-colors">
                        <input type="checkbox" id="remoteFilter" class="form-checkbox h-5 w-5 text-brand-600 rounded border-brand-300 focus:ring-brand-400">
                        <span class="ml-2 text-brand-700">可遠距/線上</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be populated here -->
        </div>

        <div id="noResults" class="hidden text-center py-20">
            <svg class="mx-auto h-12 w-12 text-brand-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h3 class="mt-2 text-sm font-medium text-brand-900">沒有找到符合條件的資源</h3>
            <p class="mt-1 text-sm text-brand-500">請嘗試調整您的篩選條件或搜尋關鍵字。</p>
        </div>
    </main>

    <footer class="bg-white border-t border-brand-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-brand-500">
                資料來源：臺灣 BDSMer 友善之助人工作者資源網
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
